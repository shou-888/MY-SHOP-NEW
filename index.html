<!DOCTYPE html>
<html lang="zh-CN">
<head>

<meta charset="UTF-8">
<title>YOUR BRAND商城</title>

<style>

body{
font-family:Arial;
margin:0;
}

header{
padding:20px;
font-size:30px;
font-weight:bold;
border-bottom:1px solid #ddd;
display:flex;
justify-content:space-between;
}


a{
text-decoration:none;
color:black;
}


.banner{

height:350px;
background:#111;
color:white;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;

}


.banner h1{
font-size:60px;
}


.shop{
padding:40px;
}


.products{

display:grid;
grid-template-columns:
repeat(auto-fit,minmax(250px,1fr));
gap:30px;

}


.card{

border:1px solid #ddd;
padding:20px;
border-radius:15px;

}


.card img{

width:100%;
height:250px;
object-fit:cover;

}


button{

background:#000;
color:white;
border:0;
padding:12px 25px;
cursor:pointer;

}


</style>

</head>


<body>


<header>

YOUR BRAND

<a href="cart.html">
购物车
</a>

</header>



<section class="banner">

<h1>
YOUR BRAND
</h1>

<p>
高级品牌购物体验
</p>

</section>



<div class="shop">


<h2>
商品列表
</h2>


<div class="products" id="products">

</div>


</div>




<script>


let products =
JSON.parse(localStorage.getItem("products")) || [];


let box =
document.getElementById("products");



products.forEach(p=>{


box.innerHTML+=`

<div class="card">


<img src="${p.image}">


<h2>${p.name}</h2>


<p>
价格：¥${p.price}
</p>


<button onclick="add('${p.name}','${p.price}')">

加入购物车

</button>


</div>


`;

});




function add(name,price){


let cart=
JSON.parse(localStorage.getItem("cart"))||[];


cart.push({

name:name,

price:price

});


localStorage.setItem(
"cart",
JSON.stringify(cart)
);


alert("加入购物车成功");


}


</script>


</body>
</html>
