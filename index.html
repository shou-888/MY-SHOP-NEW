<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>我的商城</title>

<style>
body {
    margin:0;
    font-family: Arial, "Microsoft YaHei", sans-serif;
    background:#f5f5f5;
}

header {
    background:#111;
    color:white;
    padding:20px;
    text-align:center;
    font-size:28px;
}

.products {
    display:flex;
    flex-wrap:wrap;
    gap:20px;
    padding:30px;
    justify-content:center;
}

.card {
    background:white;
    width:260px;
    border-radius:12px;
    padding:15px;
    box-shadow:0 3px 10px rgba(0,0,0,.1);
}

.card img {
    width:100%;
    height:220px;
    object-fit:cover;
    border-radius:10px;
}

.name {
    font-size:20px;
    margin-top:15px;
}

.price {
    color:#e60012;
    font-size:22px;
    margin-top:10px;
    font-weight:bold;
}

button {
    width:100%;
    margin-top:15px;
    padding:12px;
    border:none;
    background:#111;
    color:white;
    border-radius:8px;
    cursor:pointer;
}
</style>

</head>


<body>

<header>
我的商城
</header>


<div class="products">


<div class="card">

<img src="/images/31316796315.jpg">

<div class="name">
精品商品1
</div>

<div class="price">
¥99
</div>

<button>
加入购物车
</button>

</div>



<div class="card">

<img src="/images/product2.jpg">

<div class="name">
时尚商品2
</div>

<div class="price">
¥199
</div>

<button>
加入购物车
</button>

</div>



<div class="card">

<img src="/images/product3.jpg">

<div class="name">
热门商品3
</div>

<div class="price">
¥299
</div>

<button>
加入购物车
</button>

</div>


</div>


</body>
</html>
