<!DOCTYPE html>
<html lang="zh-CN">
<head>

<meta charset="UTF-8">
<title>Everlasting 商城</title>

<style>
.products{
    padding:40px;
    text-align:center;
}

.product-list{
    display:flex;
    gap:20px;
    justify-content:center;
}

.product{
    width:250px;
    border:1px solid #ddd;
    padding:20px;
    border-radius:10px;
}

.product img{
    width:100%;
}

.product button{
    background:#111;
    color:white;
    border:none;
    padding:10px 20px;
    cursor:pointer;
}

</style>

</head>


<body>


<header>

<div class="brand">
    SHOU SHOP
</div>

<p class="slogan">
    精选好物 · 简单购物 · 快速配送
</p>



<section class="banner">

<h1>
SHOU SHOP
</h1>

<p>
高级品牌购物体验
</p>

</section>



<div class="shop">


<h2>
<section class="products">

<h2>热门商品</h2>

<div class="product-list">

<div class="product">
<img src="https://via.placeholder.com/300">

<h3>智能手机</h3>

<p>价格：¥2999</p>

<button>
加入购物车
</button>

</div>


<div class="product">

<img src="https://via.placeholder.com/300">

<h3>无线耳机</h3>

<p>价格：¥399</p>

<button>
加入购物车
</button>

</div>


<div class="product">

<img src="https://via.placeholder.com/300">

<h3>智能手表</h3>

<p>价格：¥899</p>

<button>
加入购物车
</button>

</div>

</div>

</section>
</h2>


<div class="products" id="products">

</div>


</div>




<script>


let products =
JSON.parse(localStorage.getItem("products")) || [];


let box =
document.getElementById("products");



products.forEach(p=>{


box.innerHTML+=`

<div class="card">


<img src="${p.image}">


<h2>${p.name}</h2>


<p>
价格：¥${p.price}
</p>


<button onclick="add('${p.name}','${p.price}')">

加入购物车

</button>


</div>


`;

});




function add(name,price){


let cart=
JSON.parse(localStorage.getItem("cart"))||[];


cart.push({

name:name,

price:price

});


localStorage.setItem(
"cart",
JSON.stringify(cart)
);


alert("加入购物车成功");


}


</script>


</body>
</html>
