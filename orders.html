<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<title>订单管理</title>


<style>

body{

font-family:Arial;
padding:40px;

}


.order{

border:1px solid #ddd;
padding:20px;
margin:20px;

}


</style>


</head>


<body>


<h1>
订单管理后台
</h1>


<div id="list"></div>




<script>


let orders=

JSON.parse(localStorage.getItem("orders")) || [];



let box=

document.getElementById("list");



orders.forEach(o=>{


box.innerHTML+=`


<div class="order">


<h3>
客户：${o.user}
</h3>


<p>
电话：${o.phone}
</p>


<p>
地址：${o.address}
</p>


<p>
时间：${o.time}
</p>


<h4>
购买商品：
</h4>


${o.products.map(p=>

p.name+" ¥"+p.price

).join("<br>")}



</div>


`;


});


</script>


</body>

</html>
