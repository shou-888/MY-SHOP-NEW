<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<title>购物车</title>


<style>

body{

font-family:Arial;
padding:40px;

}


.item{

border:1px solid #ddd;
padding:20px;
margin:20px;

}


button{

background:black;
color:white;
padding:10px 20px;
border:0;

}

</style>


</head>


<body>


<h1>
我的购物车
</h1>


<div id="cart"></div>


<h2>

总价格：
¥<span id="total">0</span>

</h2>



<script>


let cart =
JSON.parse(localStorage.getItem("cart"))||[];


let box =
document.getElementById("cart");


let total=0;



cart.forEach((p,i)=>{


total+=Number(p.price);



box.innerHTML+=`

<div class="item">


<h2>
${p.name}
</h2>


<p>
价格：¥${p.price}
</p>


<button onclick="remove(${i})">

删除

</button>


</div>


`;


});



document.getElementById("total")
.innerHTML=total;




function remove(i){


cart.splice(i,1);


localStorage.setItem(
"cart",
JSON.stringify(cart)
);


location.reload();


}


</script>


</body>

</html>
