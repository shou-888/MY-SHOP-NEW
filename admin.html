<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<title>后台管理</title>


<style>

body{

font-family:Arial;
padding:40px;
background:#f5f5f5;

}


input{

display:block;
padding:12px;
margin:15px;
width:300px;

}


button{

background:black;
color:white;
padding:12px 25px;
border:0;

}


.product{

background:white;
padding:20px;
margin-top:20px;

}


img{

width:150px;

}


</style>


</head>


<body>


<h1>
YOUR BRAND 后台
</h1>


<input id="name"
placeholder="商品名称">


<input id="price"
placeholder="商品价格">


<input id="image"
placeholder="图片地址">


<button onclick="addProduct()">

添加商品

</button>


<h2>
商品管理
</h2>


<div id="list"></div>



<script>


let products =
JSON.parse(localStorage.getItem("products"))||[];



function show(){


let box=document.getElementById("list");

box.innerHTML="";


products.forEach((p,i)=>{


box.innerHTML+=`

<div class="product">

<img src="${p.image}">

<h3>
${p.name}
</h3>

<p>
价格：¥${p.price}
</p>


<button onclick="del(${i})">
删除
</button>


</div>

`;

});


}



function addProduct(){


let p={

name:
document.getElementById("name").value,


price:
document.getElementById("price").value,


image:
document.getElementById("image").value

};


products.push(p);


localStorage.setItem(
"products",
JSON.stringify(products)
);


show();


}




function del(i){


products.splice(i,1);


localStorage.setItem(
"products",
JSON.stringify(products)
);


show();


}



show();


</script>


</body>

</html>
